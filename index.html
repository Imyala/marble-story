<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Marble Story</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: #0a0c14; color: #cdd6f4;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        overflow: hidden;
      }
      #app { width: 100%; height: 100%; display: grid; place-items: center; }
      canvas {
        image-rendering: pixelated;
        background: #000;
        box-shadow: 0 0 0 1px #1e2030, 0 24px 60px rgba(0,0,0,.6);
        max-width: 100vw; max-height: 100vh;
      }
      #boot { position: fixed; inset: 0; display: grid; place-items: center;
              background: #0a0c14; z-index: 10; letter-spacing: .3em; font-size: 13px; }
      #boot.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <div id="boot">MARBLE&nbsp;STORY</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
