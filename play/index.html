<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 L20 12 L29 13 L22 19 L24 29 L16 24 L8 29 L10 19 L3 13 L12 12 Z' fill='%23a870ff'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23f5c46b'/%3E%3C/svg%3E" />
    <title>Wyrmling: First Flight</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; overflow: hidden;
        background: #0b0816; color: #e9e2ff;
      }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; z-index: 100;
        background: radial-gradient(ellipse at center, #1c1233 0%, #0b0816 70%);
        font-family: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
        letter-spacing: .4em; font-size: 15px; color: #c9b6ff; text-align: center; padding: 24px; }
      #boot.hidden { display: none; }
      #boot.failed { letter-spacing: normal; line-height: 1.7; color: #ffb27a; }
      #boot.failed b { display: block; margin-bottom: 10px; letter-spacing: .2em; color: #f5c46b; }
    </style>
    <script type="module" crossorigin src="./assets/dev-BK47E6cx.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/dev-CEwdfGdJ.css">
  </head>
  <body>
    <div id="game-root"></div>
    <div id="boot"><span id="boot-text">WYRMLING</span></div>
    <script>
      // If the game module never runs, the boot screen would otherwise sit
      // there forever looking like a hang. Say what happened instead.
      window.__bootTimer = setTimeout(function () {
        if (window.wyrm) return;
        var boot = document.getElementById('boot');
        if (!boot || boot.classList.contains('hidden')) return;
        boot.classList.add('failed');
        boot.innerHTML = '<div><b>WYRMLING</b>The game could not start: its code was not loaded.<br />' +
          'This page is the development entry point. Run <code>npm run dev</code>, or open a built copy.</div>';
      }, 12000);
    </script>
  </body>
</html>
